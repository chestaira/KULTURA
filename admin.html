<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<title>Admin – KULTURA</title><meta name="robots" content="noindex"></head><body class="adm">
<header class="mast"><div class="wrap"><a class="logo" href="index.html">KULTURA</a><p class="tag">Ruang redaksi</p></div></header>
<main class="wrap">
<form id="login" class="panel" hidden>
  <h1>Masuk</h1>
  <label>Email<input id="em" type="email" required autocomplete="username"></label>
  <label>Kata sandi<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn">Masuk</button><p id="lerr" class="err"></p>
</form>

<section id="dash" hidden>
  <div class="bar"><h1>Tulisan</h1><div><button class="btn" id="new">Tulisan baru</button> <button class="btn ghost" id="st">Statistik</button> <button class="btn ghost" id="out">Keluar</button></div></div>
  <ul id="mine" class="mine"></ul>
</section>

<section id="stats" hidden>
  <div class="bar"><h1>Statistik</h1><div><select id="range" aria-label="Periode"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option></select> <button class="btn ghost" id="back">Kembali</button></div></div>
  <div id="sbody"><p class="msg">Memuat…</p></div>
</section>

<form id="ed" class="panel" hidden>
  <h1 id="edt">Tulisan baru</h1>
  <label>Judul<input id="f-title" required></label>
  <div class="two">
    <label>Kategori<select id="f-cat"></select></label>
    <label>Penulis<input id="f-author"></label>
  </div>
  <label>Ringkasan (kosongkan untuk otomatis dari paragraf awal)<textarea id="f-ex" rows="2"></textarea></label>
  <div class="cov"><span>Gambar sampul</span><input type="file" id="f-cover" accept="image/*"><img id="cov-prev" alt="" hidden></div>
  <div class="tb" role="toolbar" aria-label="Format">
    <button type="button" data-c="bold"><b>B</b></button><button type="button" data-c="italic"><i>I</i></button>
    <button type="button" data-c="h2">Judul bagian</button><button type="button" data-c="quote">Kutipan</button>
    <button type="button" data-c="ul">Daftar</button><button type="button" data-c="link">Tautan</button>
    <button type="button" data-c="img">Sisipkan gambar</button><input type="file" id="f-img" accept="image/*" hidden>
  </div>
  <div id="body" class="prose editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Isi tulisan"></div>
  <p class="hint">Tempel (Ctrl+V) langsung dari Word atau Google Docs. Gambar dari clipboard juga bisa ditempel.</p>
  <label class="chk"><input type="checkbox" id="f-pub" checked> Terbitkan</label>
  <div class="bar"><button class="btn" id="save">Simpan</button><button type="button" class="btn ghost" id="cancel">Batal</button></div>
  <p id="serr" class="err"></p>
</form>
</main>
<script src="admin.js"></script></body></html>
